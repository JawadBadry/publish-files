<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشاركة الملفات</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- مكتبة PeerJS للربط المباشر بين الأجهزة بدون سيرفر -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-lg bg-gray-900 border border-gray-800 rounded-2xl shadow-xl p-6 sm:p-8 text-center">
        <h1 class="text-2xl font-bold text-white mb-2">مشاركة الملفات المباشرة</h1>
        <p class="text-gray-400 text-sm mb-6">شارك الملفات من جهازك لصديقك مباشرة!</p>

        <!-- حالة الاتصال -->
        <div id="status-badge" class="mb-4 inline-block px-3 py-1 rounded-full text-xs font-semibold bg-yellow-950 text-yellow-400 border border-yellow-800">
            جاري الاتصال بالشبكة...
        </div>

        <!-- قسم المُرسل (إرسال ملف) -->
        <div id="sender-section" class="hidden">
            <div class="border-2 border-dashed border-gray-700 hover:border-emerald-500 rounded-xl p-6 mb-4 cursor-pointer relative bg-gray-950/50">
                <input type="file" id="file-input" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" onchange="prepareFile(event)">
                <p id="file-label" class="text-gray-300 font-medium">اضغط لاختيار ملف للإرسال</p>
            </div>
            
            <div id="link-box" class="hidden mt-4">
                <p class="text-xs text-emerald-400 mb-2">✨ انسخ الرابط وأرسله لصديقك (حافظ على فتح هذه الصفحة):</p>
                <div class="flex gap-2">
                    <input type="text" id="share-url" readonly class="w-full bg-gray-950 border border-gray-800 rounded-lg px-3 py-2 text-sm text-gray-300 text-center" dir="ltr">
                    <button onclick="copyShareLink()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors shrink-0">
                        نسخ
                    </button>
                </div>
            </div>
        </div>

        <!-- قسم المُستقبل (استقبال ملف عبر الرابط) -->
        <div id="receiver-section" class="hidden">
            <div id="receiving-status" class="p-4 bg-gray-800/60 rounded-xl mb-4">
                <p class="text-sm text-gray-300">جاري الاتصال بالمرسل لتحميل الملف...</p>
            </div>
            <a id="download-btn" class="hidden block w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 rounded-xl transition-colors shadow-lg">
                تحميل الملف الآن 📥
            </a>
        </div>
    </div>

    <script>
        let peer;
        let selectedFile = null;
        const statusBadge = document.getElementById('status-badge');

        peer = new Peer();

        peer.on('open', (id) => {
            statusBadge.innerText = 'متصل وجاهز!';
            statusBadge.className = 'mb-4 inline-block px-3 py-1 rounded-full text-xs font-semibold bg-emerald-950 text-emerald-400 border border-emerald-800';

            const urlParams = new URLSearchParams(window.location.search);
            const senderId = urlParams.get('peer');

            if (senderId) {
                document.getElementById('receiver-section').classList.remove('hidden');
                connectToSender(senderId);
            } else {
                document.getElementById('sender-section').classList.remove('hidden');
            }
        });

        function prepareFile(event) {
            selectedFile = event.target.files[0];
            if (!selectedFile) return;

            document.getElementById('file-label').innerText = `تم اختيار: ${selectedFile.name}`;
            
            const baseUrl = window.location.href.split('?')[0];
            const fullLink = `${baseUrl}?peer=${peer.id}`;

            document.getElementById('share-url').value = fullLink;
            document.getElementById('link-box').classList.remove('hidden');
        }

        function copyShareLink() {
            const input = document.getElementById('share-url');
            input.select();
            navigator.clipboard.writeText(input.value);
            alert('تم نسخ الرابط إلى الحافظة بنجاح!');
        }

        peer.on('connection', (conn) => {
            conn.on('open', () => {
                statusBadge.innerText = 'متصل مع صديق، جاري إرسال الملف...';
                conn.send({
                    file: selectedFile,
                    name: selectedFile.name,
                    type: selectedFile.type
                });
            });
        });

        function connectToSender(senderId) {
            const conn = peer.connect(senderId);

            conn.on('data', (data) => {
                document.getElementById('receiving-status').innerHTML = `<p class="text-sm text-emerald-400 font-semibold">✨ تم استلام الملف بنجاح!</p>`;
                
                const blob = new Blob([data.file], { type: data.type });
                const fileUrl = URL.createObjectURL(blob);
                
                const downloadBtn = document.getElementById('download-btn');
                downloadBtn.href = fileUrl;
                downloadBtn.download = data.name;
                downloadBtn.classList.remove('hidden');
            });
        }
    </script>
</body>
</html>
